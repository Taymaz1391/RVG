<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.6" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Clean Minimalist Squircle Base -->
  <rect x="32" y="32" width="448" height="448" rx="112" ry="112" fill="url(#bgGrad)" stroke="#1f2937" stroke-width="6" />

  <!-- Outer Minimalist Glow Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#glowGrad)" stroke-width="4" stroke-dasharray="6 6" opacity="0.4" />

  <!-- Minimalist Geometric Core: Elegant Continuous T-Brand Mark -->
  <!-- Top horizontal bar with rounded ends -->
  <rect x="144" y="156" width="224" height="44" rx="22" fill="url(#emeraldGrad)" filter="url(#softGlow)" />
  
  <!-- Central vertical stem with elegant tapering and rounded base -->
  <rect x="234" y="178" width="44" height="178" rx="22" fill="url(#emeraldGrad)" filter="url(#softGlow)" />

  <!-- Minimalist Neural Connection Nodes -->
  <circle cx="156" cy="178" r="14" fill="#ffffff" />
  <circle cx="356" cy="178" r="14" fill="#ffffff" />
  <circle cx="256" cy="344" r="14" fill="#ffffff" />

  <!-- Subtle connecting accent curves -->
  <path d="M 156 178 C 156 280, 234 344, 256 344" fill="none" stroke="url(#emeraldGrad)" stroke-width="12" stroke-linecap="round" opacity="0.85" />
  <path d="M 356 178 C 356 280, 278 344, 256 344" fill="none" stroke="url(#emeraldGrad)" stroke-width="12" stroke-linecap="round" opacity="0.85" />

  <!-- Center Accent Spark -->
  <circle cx="256" cy="178" r="8" fill="#ffffff" />
</svg>
