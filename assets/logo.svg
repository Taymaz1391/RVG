<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="tomGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10a37f" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10a37f" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer rotating ring accent -->
  <circle cx="50" cy="50" r="46" stroke="url(#tomGrad)" stroke-width="1.8" stroke-dasharray="8 6" opacity="0.6" />
  
  <!-- Main glowing circle -->
  <circle cx="50" cy="50" r="40" fill="#171717" stroke="url(#tomGrad)" stroke-width="2.5" filter="url(#glow)" />
  
  <!-- Geometric neural interconnected petals -->
  <g opacity="0.85">
    <path d="M50 16 C60 28, 60 40, 50 50 C40 40, 40 28, 50 16 Z" fill="url(#tomGrad)" opacity="0.5" />
    <path d="M50 84 C60 72, 60 60, 50 50 C40 60, 40 72, 50 84 Z" fill="url(#tomGrad)" opacity="0.5" />
    <path d="M16 50 C28 60, 40 60, 50 50 C40 40, 28 40, 16 50 Z" fill="url(#tomGrad)" opacity="0.5" />
    <path d="M84 50 C72 60, 60 60, 50 50 C60 40, 72 40, 84 50 Z" fill="url(#tomGrad)" opacity="0.5" />
  </g>

  <!-- Central stylized futuristic 'T' -->
  <g filter="url(#glow)">
    <!-- Top horizontal bar -->
    <path d="M30 33 C30 31.5, 31.5 30, 33 30 L67 30 C68.5 30, 70 31.5, 70 33 L70 37 C70 38.5, 68.5 40, 67 40 L54 40 L54 67 C54 68.5, 52.5 70, 51 70 L49 70 C47.5 70, 46 68.5, 46 67 L46 40 L33 40 C31.5 40, 30 38.5, 30 37 Z" fill="#ffffff" />
    <!-- Core glowing gem -->
    <circle cx="50" cy="35" r="3.5" fill="#10a37f" />
  </g>
</svg>
